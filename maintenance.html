<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Portal Maintenance | TAU-NSTP</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #183126;
            background: linear-gradient(145deg, #edf7f0, #f8fbf9);
        }

        main {
            width: min(620px, 100%);
            padding: 42px 32px;
            text-align: center;
            background: #fff;
            border-top: 6px solid #177245;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(22, 72, 48, 0.14);
        }

        .status {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 13px;
            color: #8a5700;
            background: #fff4d6;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        p {
            margin: 10px 0;
            color: #52635b;
            font-size: 1.05rem;
            line-height: 1.65;
        }

        .notice {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #dfe8e3;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <div class="status">Temporary maintenance</div>
        <h1>NSTP Portal is temporarily closed</h1>
        <p>We are performing emergency maintenance to restore reliable access to the portal.</p>
        <p class="notice">Please wait for the official announcement before accessing the quiz.</p>
    </main>
</body>
</html>
